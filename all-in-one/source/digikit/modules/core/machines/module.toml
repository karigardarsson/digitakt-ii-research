# ---- patches: hooks (code in the objects above), bound writes and repointed table references ------------------------

# dispatch: the descriptor of an added type is its registry row

[[op]]
op = "hook"
cpu = "cf"
anchor = "cf.machines.dispatch"
offset = 0
to = "mf_dispatch"
displaced = "run"
devices = ["dt2"]

[[op]]
