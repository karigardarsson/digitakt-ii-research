[module]
id = "core/machines"
version = "0.2.0"
name = "Machine types"
category = "core"
status = "experimental"
summary = "Framework that adds machine types to the Digitakt II and Digitone II MAIN OS: ordinary ColdFire assembly that looks the registry up at run time, hooks at the firmware's machine sites, and copies of the stock tables with one row appended per machine"
requires = []
conflicts = []

# Content modules list `core/machines` in `requires` and add machines with
#
#     [[entry]]
#     registry = "machines"
#     id = "pluck"
#     name = "Pluck"           # the machine list (the UI upper-cases it)
#     short = "PLK"            # the SRC page header
#     clone_of = 0             # stock type whose permission, per-type byte, name hint and DSP selector it copies
#     position = 2             # index in the displayed list (default: the end)
#     f0 = 0xca ... f8 = 0x0a  # the nine descriptor ID fields; a parameter of core/params as "params.<id>.index"
#     own_dsp = 1              # Digitone II: the DSP is told the machine's own type
#
# The type of an entry is its permanent number in types.toml (key "<module id>:<entry id>", per device; the file
# also holds the highest supported number); patchkit refuses an entry without a number. Symbols: machines.first,
# .count (rows incl. gaps), .entries (rows that are machines), .rows, .row_size, machines.<id>.index (the type number a
# DSP object or a voice entry names).
# Row layout (offsets in src/cf/*/machines.s): the order of the fields below, every field one 32-bit word.
# Digitone II: a machine with own parameter pages adds `[[entry]] registry = "pages"` rows (documented at the registry
# below) and, for its knobs, `registry = "params"` rows of core/params; without page rows it is a clone of `clone_of`.
# Contract, evidence and limits: finding 02, "core.machines" and "DN2 own parameter pages: built".

[targets]
"dt2-1.16" = "experimental"
"dt2-1.17" = "experimental"
"dn2-1.11" = "experimental"
"dn2-1.12" = "experimental"

# ---- the registry --------------------------------------------------------------------------------------------------

[[registry]]
name = "machines"
first = "image.u8(cf.machines.dispatch + 1) + 1"   # `moveq #last,D1` of the dispatch: the stock type count
max = 32
region = "cf.expansion"
# Permanent type numbers (types.toml, finding 02 "Stable machine type numbers"): a machine's type is its number in that
# table, never "the k-th selected machine". A number nobody selected is a gap row: a clone of type 0 that the machine
# list does not show (position 0xffffffff) and nobody can pick; a stored project that names it plays as type 0.
index_table = "types.toml"

[registry.gap]
clone_of = 0
position = 0xffffffff
own_dsp = 0
name = ""
short = ""

# 0, 1: the dispatch descriptor's long and short name (std::string characters), built at run time from name and short
[[registry.field]]
name = "d_long"
kind = "u32"
default = 0
[[registry.field]]
name = "d_short"
kind = "u32"
default = 0
[[registry.field]]
name = "f0"
kind = "u32"
default = 0
[[registry.field]]
name = "f1"
kind = "u32"
default = 0
[[registry.field]]
name = "f2"
kind = "u32"
default = 0
[[registry.field]]
name = "f3"
kind = "u32"
default = 0
[[registry.field]]
name = "f4"
kind = "u32"
default = 0
[[registry.field]]
name = "f5"
kind = "u32"
default = 0
[[registry.field]]
name = "f6"
kind = "u32"
default = 0
[[registry.field]]
name = "f7"
kind = "u32"
default = 0
[[registry.field]]
name = "f8"
kind = "u32"
default = 10
[[registry.field]]
name = "clone_of"
kind = "u32"
[[registry.field]]
name = "position"
kind = "u32"
default = 255
[[registry.field]]
name = "own_dsp"
kind = "u32"
default = 0
[[registry.field]]
name = "name"
kind = "cstr"
max_len = 23
[[registry.field]]
name = "short"
kind = "cstr"
max_len = 23
[[registry.field]]
name = "one_page"           # Digitakt II: 1 = one SRC page (src/cf/dt2/onepage.s); the second page repeats the first
kind = "u32"
default = 0

[[claim]]
resource = "cf.machines.sites"

# ---- own parameter pages (Digitone II) ---------------------------------------------------------------------------

# One row per page of a machine with its own parameter pages (the page table of the firmware has a page descriptor of 44
# bytes per page: two std::string characters pointers and nine parameter codes, the last one 10 = the track level).
# Content modules add pages with
#
#     [[entry]]
#     registry = "pages"
#     machine = "machines.pluck.index"   # the type the page belongs to (pages are numbered in entry order)
#     name = "PLUCK"                     # the short page name (SYN1 ...), at most 23 characters
#     title = "Pluck"                    # the title shown on the page
#     c0 = "params.pluck_decay.index"    # knob A .. H: a parameter code (a core/params code, or a stock code); 0 = no knob
#     s0 = 25                            # the sound-array slot (25 .. 64) of that code's row: slot -> code for the defaults
#     ...                                # c8 = 10 (track level) by default
#
# A machine with at least one page gets: its own page count and descriptors, its own slot -> code mapping, and the page
# and draw functions see its own type (not the clone's). A machine without a page row behaves as a clone.
[[registry]]
name = "pages"
devices = ["dn2"]
first = "0"
max = 32
region = "cf.expansion"

[[registry.field]]
name = "name"
kind = "cstr"
max_len = 23
[[registry.field]]
name = "title"
kind = "cstr"
max_len = 23
[[registry.field]]
name = "c0"
kind = "u32"
default = 0
[[registry.field]]
name = "c1"
kind = "u32"
default = 0
[[registry.field]]
name = "c2"
kind = "u32"
default = 0
[[registry.field]]
name = "c3"
kind = "u32"
default = 0
[[registry.field]]
name = "c4"
kind = "u32"
default = 0
[[registry.field]]
name = "c5"
kind = "u32"
default = 0
[[registry.field]]
name = "c6"
kind = "u32"
default = 0
[[registry.field]]
name = "c7"
kind = "u32"
default = 0
[[registry.field]]
name = "c8"
kind = "u32"
default = 10
[[registry.field]]
name = "machine"
kind = "u32"
[[registry.field]]
name = "s0"
kind = "u32"
default = 0
[[registry.field]]
name = "s1"
kind = "u32"
default = 0
[[registry.field]]
name = "s2"
kind = "u32"
default = 0
[[registry.field]]
name = "s3"
kind = "u32"
default = 0
[[registry.field]]
name = "s4"
kind = "u32"
default = 0
[[registry.field]]
name = "s5"
kind = "u32"
default = 0
[[registry.field]]
name = "s6"
kind = "u32"
default = 0
[[registry.field]]
name = "s7"
kind = "u32"
default = 0
[[registry.field]]
name = "s8"
kind = "u32"
default = 0

# ---- copies of the stock tables, one row appended per machine (the clone's row; names are ours) -------------------------

# the displayed order of the stock list (the run-time builder inserts the machines at their positions)
[[section]]
name = "mf_list_stock"
region = "cf.expansion"
from = { anchor = "cf.machines.tab.list", len = "(image.u8(cf.machines.dispatch + 1) + 1) * 4" }

# name table: {long, short, header hint} per type
[[section]]
name = "mf_names"
region = "cf.expansion"
from = { anchor = "cf.machines.tab.names", len = "(image.u8(cf.machines.dispatch + 1) + 1) * 12" }
append = { registry = "machines", row = ["$name", "$short", "image.u32(cf.machines.tab.names + 12 * $clone_of + 8)"] }

# permission mask per type
[[section]]
name = "mf_permit"
region = "cf.expansion"
from = { anchor = "cf.machines.tab.permit", len = "(image.u8(cf.machines.dispatch + 1) + 1) * 4" }
append = { registry = "machines", row = ["image.u32(cf.machines.tab.permit + 4 * $clone_of)"] }

# one byte per type (Digitakt II only)
[[section]]
name = "mf_pertype"
region = "cf.expansion"
devices = ["dt2"]
from = { anchor = "cf.machines.tab.pertype", len = "(image.u8(cf.machines.dispatch + 1) + 1)" }
append = { registry = "machines", row = ["u8:image.u8(cf.machines.tab.pertype + $clone_of)"] }

# the type -> selector word table of the DSP's sample renderer chooser (Digitakt II only)
[[section]]
name = "mf_selector"
region = "dsp.l2"
devices = ["dt2"]
from = { anchor = "dsp.machines.selector_data", len = "(image.u8(cf.machines.dispatch + 1) + 1) * 4" }
append = { registry = "machines", row = ["image.u32(dsp.machines.selector_data + 4 * $clone_of)"] }

# the type reader of the Digitone II, copied: its callers that want the real type call this copy
[[section]]
name = "mf_reader_real"
region = "cf.expansion"
devices = ["dn2"]
from = { anchor = "cf.machines.reader_fn", len = 48 }

# ---- code -----------------------------------------------------------------------------------------------------------

