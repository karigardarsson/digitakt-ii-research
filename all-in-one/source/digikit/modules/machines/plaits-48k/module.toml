[module]
id = "machines/plaits-48k"
version = "0.1.0"
name = "Plaits, direct 48 kHz"
category = "machines"
status = "experimental"
summary = "PLAITS rendered at 48 kHz straight into the voice output (the default build)."
ports = ["dt2-1.17"]
requires = ["machines/plaits", "core/dsp-inline"]
conflicts = ["machines/plaits-96k"]

[targets]
"dt2-1.17" = "experimental"

# The PLAITS voice routine (modules/machines/plaits: the entry shim src/dsp/plaits_entry.s, the C voice wrapper and
# engines) in mode 1: 32 samples at 48 kHz written straight into the voice output (the stock decimator is skipped;
# core/dsp-inline `_di_return_out`). src/dsp/mode.s, listed first, defines PLAITS_MODE for the shim; the C sources are
# the same in both builds (the shim passes the output rate). Images: out/patch/plaits-va-48k-1.17.syx (H2, VA), out/patch/plaits-2models-48k-1.17.syx (H3, VA and ASYM-TRI), out/patch/plaits-5models-48k-1.17.syx (H3b, models 0 to 4).
[[object]]
path = "build/plaits-48k-dsp.dko.json"
sources = [
  "src/dsp/mode.s",
  "../plaits/src/dsp/plaits_entry.s",
  "../plaits/src/dsp/lib/resonator_svf4_sm.s",
  "../plaits/src/dsp/lib/drums_sm.s",
  "../plaits/src/dsp/post_sm.s",
  "../plaits/src/dsp/wrap_sm.s",
  "../plaits/src/dsp/lib/wavetable_sm.s",
  "../plaits/src/dsp/lib/string_synth_sm.s",
  "../plaits/src/dsp/lib/chord_loops_sm.s",
  "../plaits/src/dsp/lib/phase_dist_sm.s",
  "../plaits/src/dsp/lib/additive_sm.s",
  "../plaits/src/dsp/lib/va_sm.s",
  "../plaits/src/dsp/lib/grain_sm.s",
  "../plaits/src/dsp/lib/noise_sm.s",
  "../plaits/src/dsp/lib/dust_sm.s",
  "../plaits/src/dsp/lib/string_machine_sm.s",
  "../plaits/src/dsp/lib/swarm_sm.s",
  "../plaits/src/dsp/lib/terrain_sm.s",
  "../plaits/src/dsp/lib/fm_sm.s",
  "../plaits/src/dsp/lib/vcf_sm.s",
  "../plaits/src/dsp/lib/wavetable_engine_sm.s",
  "../plaits/src/dsp/lib/svf_sm.s",
  "../plaits/src/dsp/lib/sam_sm.s",
  "../plaits/src/dsp/lib/ws_sm.s",
  "../plaits/src/dsp/lib/va_mix_sm.s",
  "../plaits/src/dsp/plaits.c",
  "../plaits/src/dsp/engines/va.c",
  "../plaits/src/dsp/engines/waveshaping.c",
  "../plaits/src/dsp/engines/fm.c",
  "../plaits/src/dsp/engines/grain.c",
  "../plaits/src/dsp/engines/additive.c",
  "../plaits/src/dsp/engines/wavetable.c",
  "../plaits/src/dsp/engines/chord.c",
