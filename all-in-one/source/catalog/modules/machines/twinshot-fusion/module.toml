[module]
id = "machines/twinshot-fusion"
version = "0.2.0"
name = "Twinshot Sample Fusion"
category = "machines"
status = "experimental"
summary = "Legacy FUSE plus ten-control FUS2: independent starts, relative sync, clean-to-ring, depth/recovery sidechain and manual/timed morph; owned note-off state."
ports = ["dt2-1.17"]
requires = ["core/machines", "core/params", "core/dsp-inline", "machines/plaits-48k", "machines/twinshot"]
conflicts = []
[targets]
"dt2-1.17" = "experimental"

[[object]]
path = "../../../../experiments/twinshot_fusion_v2/build/fusion-dsp.dko.json"
sources = ["../../../../experiments/twinshot_fusion_v2/entry.s", "../../../../experiments/twinshot_fusion_v2/conversions.s", "../../../../experiments/twinshot_fusion_v2/adapter.c"]
place = "dsp.l2"
devices = ["dt2"]
[object.externs]
"tw_load." = "twinshot.native.load"
"tw_arm." = "twinshot.native.arm"
"tw_pitch." = "twinshot.native.pitch"
"tw_sample." = "twinshot.native.sample"
_tf_level_tail = "hook.fusion2.level_decode.tail"

[[object]]
path = "../../../../experiments/twinshot_fusion_v2/build/fusion-cf.dko.json"
sources = ["../../../../experiments/twinshot_fusion_v2/controls.s", "../../../../experiments/twinshot_fusion_v2/pages.s"]
place = "cf.expansion"
devices = ["dt2"]
[object.externs]
fusion_sync = "params.fusion_sync.index"
fusion_mode = "params.fusion_mode.index"
fusion_sample1 = "params.fusion_sample1.index"
fusion_sample2 = "params.fusion_sample2.index"
fusion2_sync = "params.fusion2_sync.index"
fusion2_mode = "params.fusion2_mode.index"
fusion2_sample1 = "params.fusion2_sample1.index"
fusion2_sample2 = "params.fusion2_sample2.index"
fusion2_shape = "params.fusion2_shape.index"
fusion2_start1 = "params.fusion2_start1.index"
fusion2_start2 = "params.fusion2_start2.index"
fusion2_typearg_exit = "cf.machines.typearg.exit"
fusion2_tune2 = "params.fusion2_tune2.index"
fusion2_depth = "params.fusion2_depth.index"
fusion2_tunea_ui = "params.fusion2_tunea_ui.index"
fusion2_balance_ui = "params.fusion2_balance_ui.index"
fusion2_ring_ui = "params.fusion2_ring_ui.index"
fusion2_duck_ui = "params.fusion2_duck_ui.index"
fusion2_morph_ui = "params.fusion2_morph_ui.index"
fusion2_gate_ui = "params.fusion2_gate_ui.index"
fusion2_dry_ui = "params.fusion2_dry_ui.index"
fusion2_recovery_ui = "params.fusion2_recovery_ui.index"
fusion2_sweep_ui = "params.fusion2_sweep_ui.index"
fusion2_relative_ui = "params.fusion2_relative_ui.index"
fusion2_sync_off_ui = "params.fusion2_sync_off_ui.index"
fusion2_sync_match_ui = "params.fusion2_sync_match_ui.index"
fusion2_sync_rel_ui = "params.fusion2_sync_rel_ui.index"
fusion2_header_return = "hook.plaits.dx7.headertext.return"

[[entry]]
registry = "inline_voices"
id = "twinshot_fusion"
type = "machines.twinshot_fusion.index"
pc = "_tf_render"
devices = ["dt2"]

[[entry]]
registry = "machines"
id = "twinshot_fusion"
name = "Twin Fusion"
short = "FUSE"
clone_of = 6
f0 = 0xf8
f1 = "params.fusion_sync.index"
f2 = "params.fusion_mode.index"
f3 = "params.fusion_sample1.index"
f4 = "params.fusion_tune2.index"
f5 = "params.fusion_mix.index"
f6 = "params.fusion_sample2.index"
f7 = 0xfe
f8 = 0x0a
one_page = 1
devices = ["dt2"]

[[entry]]
registry = "params"
id = "fusion_sync"
name = "Duration Sync (B follows A)"
short = "SYNC"
template = 0xfe
slot = 1
min = 0
max = 0x100
default = 0
formatter = "fusion_sync_fmt"
devices = ["dt2"]

[[entry]]
registry = "params"
id = "fusion_mode"
name = "Fusion Mode"
short = "FUSE"
template = 0xfe
slot = 2
min = 0
max = 0x300
default = 0
formatter = "fusion_mode_fmt"
devices = ["dt2"]

[[entry]]
registry = "params"
id = "fusion_sample1"
name = "Fusion Sample 1 + Direction"
short = "SMP1"
