[[op]]
op = "hook"
cpu = "sharc"
anchor = "fusion2.level_decode"
to = "_fang_level_decode"
displaced = "run"
devices = ["dt2"]

[[op]]
op = "hook"
cpu = "cf"
anchor = "fusion2.encoder_delta"
to = "fusion2_delta"
kind = "call"
displaced = "drop"
devices = ["dt2"]

[[op]]
op = "hook"
cpu = "cf"
anchor = "fusion2.split"
offset = 0
to = "fang_split"
displaced = "drop"
devices = ["dt2"]

[[op]]
op = "write"
anchor = "fusion2.paramvt"
offset = 0
value = "fang_param"
width = 4
devices = ["dt2"]

[[op]]
op = "write"
anchor = "fusion2.draw"
offset = 0
value = "0x4ef90000 | ((fusion2_draw_route >> 16) & 0xffff)"
width = 4
devices = ["dt2"]

[[op]]
op = "write"
anchor = "fusion2.draw"
offset = 4
value = "fusion2_draw_route & 0xffff"
width = 2
devices = ["dt2"]

[[op]]
op = "write"
anchor = "fusion2.draw"
offset = 6
value = 0x4e71
width = 2
devices = ["dt2"]

