name: Sample Editing Pack - native macOS
on:
  workflow_dispatch:
    inputs:
      stock_url:
        description: Optional official HTTPS OS1.17 syx/ZIP URL for private exact-output testing (never uploaded)
        required: false
        default: ''
permissions:
  contents: read
jobs:
  native-app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Install existing pinned packaging dependency
        run: python -m pip install -r sample-editing/source/builder-source/requirements-build.txt
      - name: Build and verify native app
        env:
          DT2_STOCK_URL: ${{ inputs.stock_url }}
          DT2_EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          python -c "import platform,os; assert platform.machine()==os.environ['DT2_EXPECTED_ARCH']"
          python sample-editing/macos/build_macos.py --output "$RUNNER_TEMP/dt2-macos" --stock-url "$DT2_STOCK_URL"
      - name: Upload only verified package and reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Sample-Editing-macOS-${{ matrix.arch }}
          path: ${{ runner.temp }}/dt2-macos/publish/
          if-no-files-found: error
          retention-days: 30
